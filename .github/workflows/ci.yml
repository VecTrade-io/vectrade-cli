name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  GO_VERSION_FILE: go.mod
  COVERAGE_THRESHOLD: 90

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          echo "Threshold: ${{ env.COVERAGE_THRESHOLD }}%"
          if (( $(echo "$total < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "::error::Coverage ${total}% is below ${{ env.COVERAGE_THRESHOLD }}% threshold"
            exit 1
          fi
          echo "coverage=${total}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: matrix.go-version == '1.23'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Build
        run: go build -ldflags="-s -w" -o bin/vectrade ./main.go
      - name: Smoke test
        run: bin/vectrade version
        if: runner.os != 'Windows'
      - name: Smoke test (Windows)
        run: bin\vectrade.exe version
        if: runner.os == 'Windows'
        shell: cmd

  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  live-tests:
    name: Live Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Run live tests
        env:
          VECTRADE_TEST_API_KEY: ${{ secrets.VECTRADE_TEST_API_KEY }}
        run: |
          if [ -z "$VECTRADE_TEST_API_KEY" ]; then
            echo "::warning::VECTRADE_TEST_API_KEY not set — skipping live tests"
            exit 0
          fi
          go test -v -count=1 -timeout=120s ./tests/
